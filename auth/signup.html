<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up</title>
    <script
      src="https://kit.fontawesome.com/64d58efce2.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- <h1>Signup with Supabase</h1> -->

    <!-- <form onsubmit="createNewUser(event)">
      <input type="text" id="email-input" placeholder="Email" />
      <br><br>
      <input type="password" id="password-input" placeholder="Password" />
      <button type="submit">SignUp</button>
    </form>

    <p id="showError"></p> -->

    <div class="container sign-up-mode">
      <div class="forms-container">
        <div class="signin-signup">
          <form action="#" class="sign-up-form" onsubmit="createNewUser(event)">
            <h2 class="title">Sign up</h2>
            <!-- <div class="input-field">
              <i class="fas fa-user"></i>
              <input type="text" placeholder="Username" />
            </div> -->
            <div class="input-field">
              <i class="fas fa-envelope"></i>
              <input type="email" id="email-input" placeholder="Email" />
            </div>
            <div class="input-field">
              <i class="fas fa-lock"></i>
              <input
                type="password"
                id="password-input"
                placeholder="Password"
              />
            </div>
            <!-- <input type="submit" class="btn" value="Sign up" /> -->
            <button type="submit" class="btn" value="Sign up">SignUp</button>

            <p id="showError"></p>

            <p class="social-text">Or Sign up with social platforms</p>
            <div class="social-media">
              <a href="#" class="social-icon">
                <i class="fab fa-facebook-f"></i>
              </a>
              <a href="#" class="social-icon">
                <i class="fab fa-twitter"></i>
              </a>
              <a href="#" class="social-icon">
                <i class="fab fa-google"></i>
              </a>
              <a href="#" class="social-icon">
                <i class="fab fa-linkedin-in"></i>
              </a>
            </div>
          </form>
        </div>
      </div>

      <div class="panels-container">
        <div class="panel right-panel">
          <div class="content">
            <h3>One of Our Valued Members</h3>
            <p>
              Thank you for being part of our community. Your presence enriches
              our shared experiences. Let's continue this journey together!
            </p>
            <a href="login.html" class="btn transparent">Sign in</a>
          </div>
          <img
            src="https://i.ibb.co/nP8H853/Mobile-login-rafiki.png"
            class="image"
            alt=""
          />
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../scripts/signup.js"></script>
  </body>
</html>
